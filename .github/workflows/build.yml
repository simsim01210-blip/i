name: Build

# Push to main / any tag, and every PR, triggers a build of all 4 supported
# Minecraft versions. Pushing a tag that starts with "v" (e.g. v1.0.14) also
# creates a GitHub Release with all 4 jars attached — this is the "automated
# build" step Modrinth/CurseForge require for anything distributed via GitHub
# instead of uploaded there directly.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '1.20.1'
            yarn: '1.20.1+build.10'
            api: '0.92.6+1.20.1'
            java: '17'
          - mc: '1.20.2'
            yarn: '1.20.2+build.4'
            api: '0.91.6+1.20.2'
            java: '17'
          - mc: '1.20.3'
            yarn: '1.20.3+build.1'
            api: '0.91.1+1.20.3'
            java: '17'
          - mc: '1.20.4'
            yarn: '1.20.4+build.3'
            api: '0.97.3+1.20.4'
            java: '17'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build ${{ matrix.mc }}
        run: |
          ./gradlew clean build \
            -Pminecraft_version=${{ matrix.mc }} \
            -Pyarn_mappings=${{ matrix.yarn }} \
            -Pfabric_version=${{ matrix.api }} \
            -Pjava_version=${{ matrix.java }} \
            -Pcompat_layer=legacy \
            -Pinput_layer=legacy \
            -Parchives_base_name=planetmap-mc${{ matrix.mc }} \
            -Pminecraft_dependency=~${{ matrix.mc }}

      - name: Collect jar
        run: |
          mkdir -p out
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          cp "build/libs/planetmap-mc${{ matrix.mc }}-${MOD_VERSION}.jar" \
             "out/planetmap-${{ matrix.mc }}-lil0ri.jar"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: planetmap-${{ matrix.mc }}
          path: out/planetmap-${{ matrix.mc }}-lil0ri.jar

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts into one folder
        run: |
          mkdir -p release
          find artifacts -name '*.jar' -exec cp {} release/ \;
          ls -la release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.jar
          generate_release_notes: true
